<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExpenseAI — Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body {
      min-height:100vh; background:#030712;
      display:flex; justify-content:center; align-items:center;
      color:white; position:relative;
    }
    .background {
      position:fixed; width:100%; height:100%;
      background:
        radial-gradient(circle at top left,#312e81,transparent 30%),
        radial-gradient(circle at bottom right,#0891b2,transparent 30%),
        #030712;
      z-index:-5;
    }
    .grid {
      position:fixed; width:100%; height:100%;
      background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size:45px 45px;
      animation:gridMove 15s linear infinite; z-index:-4;
    }
    @keyframes gridMove { 0%{transform:translateY(0px)} 100%{transform:translateY(45px)} }
    .blur1,.blur2 { position:fixed; border-radius:50%; filter:blur(120px); z-index:-3; }
    .blur1 { width:300px; height:300px; background:#4f46e5; top:-50px; left:-50px; }
    .blur2 { width:300px; height:300px; background:#06b6d4; bottom:-50px; right:-50px; }

    .signup-box {
      width:420px; padding:45px; border-radius:30px; position:relative;
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(20px); box-shadow:0 0 50px rgba(99,102,241,0.2);
      overflow:hidden; margin:40px 20px;
    }
    .signup-box::before {
      content:''; position:absolute; width:150px; height:150px;
      background:#06b6d4; border-radius:50%; bottom:-70px; right:-70px;
      filter:blur(80px); opacity:0.5;
    }

    .logo {
      font-size:24px; font-weight:700; margin-bottom:25px;
      background:linear-gradient(to right,#818cf8,#22d3ee);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      display:inline-block;
    }
    h1 { font-size:36px; margin-bottom:8px; }
    .subtitle { color:#94a3b8; margin-bottom:30px; font-size:15px; }

    .input-group { margin-bottom:20px; }
    .input-group label { display:block; margin-bottom:10px; color:#cbd5e1; font-size:14px; }
    .input-group input {
      width:100%; padding:15px 18px; border-radius:14px;
      background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.08);
      color:white; font-size:15px; outline:none; transition:0.3s;
    }
    .input-group input:focus {
      border-color:#6366f1; box-shadow:0 0 15px rgba(99,102,241,0.4);
    }
    .password-box { position:relative; }
    .toggle-password {
      position:absolute; right:18px; top:50%; transform:translateY(-50%);
      cursor:pointer; color:#94a3b8; font-size:14px; user-select:none;
    }
    .toggle-password:hover { color:#67e8f9; }

    .strength-bar { height:4px; border-radius:4px; background:rgba(255,255,255,0.1); margin-top:8px; overflow:hidden; }
    .strength-fill { height:100%; border-radius:4px; transition:0.3s; width:0%; }

    .error-msg {
      background:rgba(244,63,94,0.15); border:1px solid rgba(244,63,94,0.3);
      color:#fda4af; padding:12px 16px; border-radius:12px;
      margin-bottom:20px; font-size:14px; display:none;
    }
    .success-msg {
      background:rgba(20,184,166,0.15); border:1px solid rgba(20,184,166,0.3);
      color:#5eead4; padding:12px 16px; border-radius:12px;
      margin-bottom:20px; font-size:14px; display:none;
    }

    .signup-btn {
      width:100%; padding:16px; border:none; border-radius:16px;
      background:linear-gradient(to right,#4f46e5,#06b6d4);
      color:white; font-size:16px; font-weight:600; cursor:pointer;
      transition:0.3s; box-shadow:0 0 25px rgba(99,102,241,0.4); margin-top:5px;
    }
    .signup-btn:hover { transform:translateY(-4px); }
    .signup-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }

    .login-link { margin-top:25px; text-align:center; color:#94a3b8; font-size:14px; }
    .login-link a { color:#67e8f9; text-decoration:none; font-weight:600; }

    @media(max-width:500px) {
      .signup-box { width:100%; margin:20px; padding:30px 24px; }
      h1 { font-size:28px; }
    }
  </style>
</head>
<body>

<div class="background"></div>
<div class="grid"></div>
<div class="blur1"></div>
<div class="blur2"></div>

<div class="signup-box">
  <div class="logo">ExpenseAI</div>
  <h1>Create Account</h1>
  <p class="subtitle">Start your AI financial journey today</p>

  <div class="error-msg" id="errorMsg"></div>
  <div class="success-msg" id="successMsg"></div>

  <div class="input-group">
    <label>Full Name</label>
    <input type="text" id="name" placeholder="Enter your full name">
  </div>

  <div class="input-group">
    <label>Email Address</label>
    <input type="email" id="signup-email" placeholder="Enter your email">
  </div>

  <div class="input-group">
    <label>Password</label>
    <div class="password-box">
      <input type="password" id="signup-password" placeholder="Create a strong password" oninput="checkStrength(this.value)">
      <span class="toggle-password" onclick="togglePassword()">Show</span>
    </div>
    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
  </div>

  <button class="signup-btn" id="signupBtn" onclick="signup()">Create Account</button>

  <div class="login-link">
    Already have an account? <a href="login.html">Login</a>
  </div>
</div>

<script>
  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('successMsg').style.display = 'none';
  }

  function showSuccess(msg) {
    const el = document.getElementById('successMsg');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('errorMsg').style.display = 'none';
  }

  function togglePassword() {
    const input = document.getElementById('signup-password');
    const btn = document.querySelector('.toggle-password');
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = 'Hide';
    } else {
      input.type = 'password';
      btn.textContent = 'Show';
    }
  }

  function checkStrength(val) {
    const fill = document.getElementById('strengthFill');
    let score = 0;
    if (val.length >= 6) score++;
    if (val.length >= 10) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const colors = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4'];
    const widths = ['20%','40%','60%','80%','100%'];
    fill.style.width = score > 0 ? widths[score-1] : '0%';
    fill.style.background = score > 0 ? colors[score-1] : 'transparent';
  }

  async function signup() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    const btn = document.getElementById('signupBtn');

    if (!name || !email || !password) {
      showError('Please fill in all fields.');
      return;
    }
    if (password.length < 6) {
      showError('Password must be at least 6 characters.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating account...';

    try {
      const response = await fetch('http://localhost:5000/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });

      const data = await response.json();

      if (data.success) {
        showSuccess('Account created! Redirecting to login...');
        setTimeout(() => { window.location = 'login.html'; }, 1500);
      } else {
        showError(data.message || 'Signup failed. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    } catch (error) {
      console.error(error);
      showError('Cannot connect to server. Make sure the backend is running on port 5000.');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') signup();
  });

  window.addEventListener('load', () => {
    document.body.style.opacity = 0;
    setTimeout(() => {
      document.body.style.transition = '0.8s';
      document.body.style.opacity = 1;
    }, 100);
  });
</script>

</body>
</html>
